<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Livre de Recettes</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f9f9f9; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 20px; cursor: pointer; border: none; background-color: #ddd; border-radius: 5px; font-weight: bold; }
        .tab-btn.active { background-color: #007bff; color: white; }
        .content { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

    <h1>📖 Mes Recettes de Cuisine</h1>
    <div id="tabs" class="tabs"></div>
    <div id="content" class="content">Chargement des recettes...</div>

    <script>
        // Essaye d'abord dans "mes recettes/", sinon à la racine
        const paths = ['mes recettes/recettes.xlsm', 'recettes.xlsm', 'mes recettes/recettes.xlsx', 'recettes.xlsx'];
        
        async function loadExcel() {
            let data = null;
            for (let path of paths) {
                try {
                    let response = await fetch(path + '?v=' + new Date().getTime());
                    if (response.ok) {
                        data = await response.arrayBuffer();
                        break;
                    }
                } catch (e) {}
            }

            if (!data) {
                document.getElementById('content').innerHTML = "<b style='color:red;'>Erreur : Impossible de trouver ou lire le fichier recettes.xlsm. Vérifiez qu'il contient bien des données.</b>";
                return;
            }

            const workbook = XLSX.read(data, { type: 'array' });
            const tabsContainer = document.getElementById('tabs');
            const contentContainer = document.getElementById('content');
            
            tabsContainer.innerHTML = '';
            
            workbook.SheetNames.forEach((sheetName, index) => {
                const btn = document.createElement('button');
                btn.className = 'tab-btn' + (index === 0 ? ' active' : '');
                btn.innerText = sheetName;
                btn.onclick = () => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    showSheet(workbook.Sheets[sheetName]);
                };
                tabsContainer.appendChild(btn);
            });

            showSheet(workbook.Sheets[workbook.SheetNames[0]]);
        }

        function showSheet(sheet) {
            const html = XLSX.utils.sheet_to_html(sheet);
            document.getElementById('content').innerHTML = html;
        }

        loadExcel();
    </script>
</body>
</html>
